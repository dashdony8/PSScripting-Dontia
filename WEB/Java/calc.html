<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calc.css">
    <script src="js/calc.js" defer></script>
    
</head>
<body>
    <div>
        <table>
            <tr>
                <td colspan="3"></td><input type="text" id="result"></td>
                <td><button class="btn"><h2>C</h2></button></td>
            </tr> 
            <tr> 
                <td><button class="btn" onclick="getInput(7)"><h2>7</h2></button></td>
                <td><button class="btn" onclick="getInput(8)"><h2>8</h2></button></td>
                <td><button class="btn" onclick="getInput(9)"><h2>9</h2></button></td>
                <td><button class="btn" onclick="getInput('+')"><h2>+</h2></button></td>
            </tr>

             <tr> 
                <td><button class="btn" onclick="getInput(4)"><h2>4</h2></button></td>
                <td><button class="btn" onclick="getInput(5)"><h2>5</h2></button></td>
                <td><button class="btn" onclick="getInput(6)"><h2>6</h2></button></td>
                <td><button class="btn" onclick="getInput('-')"><h2>-</h2></button></td>
            </tr>

             <tr> 
                <td><button class="btn" onclick="getInput(1)"><h2>1</h2></button></td>
                <td><button class="btn" onclick="getInput(2)"><h2>2</h2></button></td>
                <td><button class="btn" onclick="getInput(3)"><h2>3</h2></button></td>
                <td><button class="btn" onclick="getInput('*')"><h2>*</h2></button></td>
            </tr>

             <tr> 
                <td><button class="btn" onclick="getInput('.')"><h2>.</h2></button></td>
                <td><button class="btn" onclick="getInput(0)"><h2>0</h2></button></td>
                <td><button class="btn" onclick="getInput('')"><h2>=</h2></button></td>
                <td><button class="btn" onclick="getInput('/')"><h2>/</h2></button></td>
            </tr>
        </table>
    </div>
</body>
</html>
